<div class="delete-modal-backdrop">
  <div class="delete-modal">
    <button class="close-btn" type="button" (click)="cancel()">
      <ion-icon name="close-outline"></ion-icon>
    </button>

    <div class="modal-icon">
      <ion-icon name="warning-outline"></ion-icon>
    </div>

    <h2>Eliminare l'account?</h2>

    <p>
      Questa azione è <strong>definitiva e irreversibile</strong>. Perderai
      per sempre progressi, livello, XP, TurtleCoins, avatar e trofei
      sbloccati. Non potrai recuperarli in nessun modo.
    </p>

    <div class="actions">
      <button class="secondary-btn" type="button" (click)="cancel()">
        Annulla
      </button>

      <button class="danger-btn" type="button" (click)="confirmDelete()">
        Elimina
      </button>
    </div>
  </div>
</div>
